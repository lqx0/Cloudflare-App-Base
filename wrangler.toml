name = "cloudflare-app-base"
main = "./src/worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "local"
EMAIL_PROVIDER = "cloudflare"
AUTH_EMAILS_LOCAL_ENABLED = "false"

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["noreply@example.com"]
remote = true

[[d1_databases]]
binding = "DB"
database_name = "cloudflare-app-base"
database_id = "local"

[env.preview]
name = "adaptquiz-preview"
workers_dev = true
[env.preview.vars]
ENVIRONMENT = "preview"
EMAIL_PROVIDER = "resend"
AUTH_EMAILS_LOCAL_ENABLED = "false"
APP_BASE_URL = "REPLACE_WITH_ADAPTQUIZ_PREVIEW_WORKERS_DEV_URL"
AUTH_EMAILS_ENABLED = "false"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "adaptquiz-preview"
database_id = "REPLACE_WITH_ADAPTQUIZ_PREVIEW_D1_DATABASE_ID"

[[env.preview.send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["noreply@example.com"]

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
EMAIL_PROVIDER = "cloudflare"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cloudflare-app-base"
database_id = "YOUR_PRODUCTION_D1_DATABASE_ID"

[[env.production.send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["noreply@example.com"]
